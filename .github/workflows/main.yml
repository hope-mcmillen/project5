name: 🛠 Android CI / Build & Release APK

on:
  push:
    branches: [ main, master, upgrade ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, upgrade ]

permissions:
  contents: write   # allow creating/updating Releases & uploading assets
  actions:  read    # allow pulling marketplace actions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  visual_tests:
    name: Windows visual regression tests
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check exact pixel baselines and UI behavior
        run: flutter test test/ui
      - name: Upload visual failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-visual-diffs
          path: test/ui/failures/**
          if-no-files-found: ignore
          retention-days: 7

  build_and_release:
    needs: visual_tests
    runs-on: ubuntu-24.04

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v6

      - name: 🚀 Cache pub deps
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: ☕️ Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 🦋 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 📥 Get dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: ✅ Run tests
        run: flutter test --coverage

      - name: Upload test failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics
          path: test/ui/failures/**
          if-no-files-found: ignore
          retention-days: 7


      - name: 🏗️ Build APKs
        run: flutter build apk --release

      - name: 📦 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*.apk artifacts/
