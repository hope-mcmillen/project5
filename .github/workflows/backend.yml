name: Backend checks
on:
  pull_request:
  push:
    branches: [master, 'feat/**', 'codex/**']
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    name: Supabase migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --local --level error
      - run: supabase test db
      - name: Check onboarding races with independent sessions
        run: python3 supabase/tests/company_concurrency.py
      - name: Verify real local Auth and PostgREST onboarding
        run: python3 supabase/tests/auth_smoke.py
      - if: always()
        run: supabase stop --no-backup
