name: Backend checks
on:
  pull_request:
  push:
    branches: [master, 'feat/**', 'codex/**', resume-parsing]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    name: Supabase migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Edge function unit tests
        working-directory: supabase/functions
        run: deno test --allow-read=..,. --allow-env _shared/ parse-resume/ parse-job/ resume-url/ delete-account/
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --local --level error
      - run: supabase test db
      - name: Check onboarding races with independent sessions
        run: python3 supabase/tests/company_concurrency.py
      - name: Verify real local Auth and PostgREST onboarding
        run: python3 supabase/tests/auth_smoke.py
      - name: Verify seeded logins and real profile/Storage boundaries
        run: python3 supabase/tests/profile_storage_smoke.py
      - name: Check apply-cap and decision races
        run: python3 supabase/tests/application_concurrency.py
      - name: Verify candidate-to-recruiter API loop
        run: python3 supabase/tests/application_api_smoke.py
      - name: Check upload and deletion serialization
        run: python3 supabase/tests/deletion_concurrency.py
      - name: Verify secure resume links, Realtime isolation and account deletion
        run: |
          printf 'PUBLIC_SUPABASE_URL=http://127.0.0.1:54321\nLLM_PROVIDER=mock\n' > /tmp/project5-edge-public.env
          supabase functions serve --env-file /tmp/project5-edge-public.env > /tmp/project5-edge.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS -X OPTIONS http://127.0.0.1:54321/functions/v1/resume-url > /dev/null && break
            sleep 1
          done
          curl -fsS -X OPTIONS http://127.0.0.1:54321/functions/v1/resume-url > /dev/null
          deno test --allow-env --allow-net --allow-run supabase/tests/privacy_integration.ts
          python3 supabase/tests/parsed_profile_api_smoke.py
      - if: always()
        run: supabase stop --no-backup
